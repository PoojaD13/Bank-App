services:
  app:
    build: .
    container_name: bank-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget","--spider", "-q", "http://localhost:8080/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 5

    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

        
  worker:
    build: .
    container_name: bank-worker
    env_file:
      - .env
    restart: unless-stopped
    command: ["node", "src/rabbitMQ/workers.js"]
    depends_on:
      rabbitmq:
        condition: service_healthy



  redis:
    image: redis/redis-stack:latest 
    container_name: bank-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:management
    container_name: bank-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics","-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
